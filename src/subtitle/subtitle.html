<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>视频字幕 · AI 双语翻译</title>
    <link rel="stylesheet" href="../ui/base.css" />
    <style>
      body {
        margin: 0;
        padding: 18px 20px 32px;
      }
      .sub-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .sub-head h1 {
        font-size: 18px;
        margin: 0;
      }
      .sub-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .sub-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      .cue-table td {
        vertical-align: top;
        line-height: 1.55;
      }
      .cue-time {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-3);
        white-space: nowrap;
        width: 96px;
      }
      .cue-src {
        width: 46%;
        color: var(--text-2);
      }
      .cue-trans {
        color: var(--text);
      }
      .cue-trans.pending {
        color: var(--text-3);
      }
      .sub-note {
        margin: 12px 0 16px;
        padding: 10px 12px;
        border-left: 3px solid var(--warn);
        background: rgba(160, 90, 0, 0.1);
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.65;
        color: var(--text-2);
      }
      .sub-note.error {
        border-left-color: var(--danger);
        background: rgba(179, 38, 30, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="sub-head">
      <img src="../icons/icon32.png" alt="" style="width: 26px; height: 26px; border-radius: 6px" />
      <h1>视频双语字幕</h1>
      <span class="spacer"></span>
      <button class="btn ghost small" id="btn-settings" type="button">字幕设置</button>
    </div>

    <div class="sub-meta">
      <span class="badge" id="status-badge">初始化…</span>
      <span class="hint" id="video-info"></span>
      <span class="spacer"></span>
      <label class="hint" for="track-select">字幕轨道</label>
      <select id="track-select" style="max-width: 280px" disabled></select>
    </div>

    <div class="sub-tools">
      <button class="btn small primary" id="btn-toggle-page" type="button">在页面上开/关字幕</button>
      <button class="btn small" id="btn-translate" type="button" disabled>翻译全部字幕</button>
      <button class="btn small ghost" id="btn-copy" type="button" disabled>复制双语字幕</button>
      <button class="btn small ghost" id="btn-export" type="button" disabled>导出 SRT</button>
    </div>

    <div id="note" hidden></div>

    <table class="table cue-table">
      <thead>
        <tr>
          <th>时间</th>
          <th>原文</th>
          <th>译文</th>
        </tr>
      </thead>
      <tbody id="cue-body"></tbody>
    </table>

    <script type="module" src="subtitle.js"></script>
  </body>
</html>
